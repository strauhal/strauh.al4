<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0000ff">
  <meta name="description" content="An immersive, spatial museum for art and photography.">
  <meta property="og:title" content="strauh.al / musuem">
  <meta property="og:description" content="Enter a blue museum without end.">
  <meta property="og:image" content="https://strauh.al/banner.gif">
  <title>strauh.al / musuem</title>
  <link rel="icon" href="./favicon.ico">
  <style>
    :root { color-scheme: dark; --blue: #00f; --white: #fff; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    body { font-family: "Times New Roman", Times, serif; color: var(--white); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    body.looking canvas { cursor: grabbing; }
    button, a { color: inherit; font: inherit; }
    button { border-radius: 0; }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.45);
    }
    #masthead {
      position: absolute;
      top: max(21px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
      display: flex;
      align-items: baseline;
      gap: 0;
    }
    #masthead a {
      font-size: 32px;
      font-weight: normal;
      pointer-events: auto;
    }
    #masthead span {
      font: 10px/1.1 Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .76;
    }
    #masthead .museum-suffix {
      font: 32px/normal "Times New Roman", Times, serif;
      letter-spacing: normal;
      text-transform: none;
      opacity: 1;
      text-decoration: none;
    }
    #location {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: max(20px, env(safe-area-inset-right));
      font: 10px/1.3 Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-align: right;
    }
    #location::after {
      content: attr(data-collection);
      display: block;
      margin-top: 7px;
      color: #fff;
      opacity: .72;
    }
    #actions {
      position: absolute;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      gap: 8px;
      pointer-events: auto;
    }
    #wing-shortcut {
      position: relative;
    }
    #shortcut-menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      width: 178px;
      display: grid;
      gap: 6px;
      padding: 7px;
      border: 1px solid #fff;
      background: #00f;
    }
    #shortcut-menu[hidden] { display: none; }
    #shortcut-menu .action {
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      text-align: left;
    }
    .action {
      appearance: none;
      min-height: 43px;
      padding: 0 16px;
      border: 1px solid #fff;
      color: #fff;
      background: rgba(0,0,255,.82);
      text-transform: uppercase;
      letter-spacing: .12em;
      font: 10px Arial, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .action:hover, .action:focus-visible { color: #00f; background: #fff; outline: none; }
    .action[hidden] { display: none; }
    #help {
      position: absolute;
      left: max(20px, env(safe-area-inset-left));
      bottom: max(20px, env(safe-area-inset-bottom));
      max-width: 420px;
      font: 10px/1.45 Arial, sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    #coordinates {
      position: absolute;
      left: max(20px, env(safe-area-inset-left));
      bottom: max(58px, calc(env(safe-area-inset-bottom) + 58px));
      padding: 7px 9px;
      border: 1px solid rgba(255,255,255,.72);
      background: rgba(0,0,255,.68);
      font: 10px/1.45 "SFMono-Regular", Consolas, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
    }
    #status {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      padding: 10px 14px;
      border: 1px solid #fff;
      background: #00f;
      font: 10px Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    #status.visible { opacity: 1; }
    #touch-stick {
      display: none;
      position: absolute;
      left: max(24px, env(safe-area-inset-left));
      bottom: max(82px, calc(env(safe-area-inset-bottom) + 70px));
      width: 92px;
      height: 92px;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
    #touch-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 32px;
      height: 32px;
      border: 1px solid #fff;
      border-radius: 50%;
      background: rgba(0,0,255,.75);
      transform: translate(-50%, -50%);
    }
    @media (pointer: coarse) {
      #touch-stick { display: block; }
      #help { display: none; }
      #actions { bottom: max(18px, env(safe-area-inset-bottom)); }
    }
    @media (max-width: 640px) {
      #location { top: 18px; right: 18px; left: auto; bottom: auto; text-align: right; }
      #help { display: none; }
      #actions { flex-direction: column; align-items: stretch; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud" aria-live="polite">
    <div id="masthead"><a href="https://strauh.al">strauh.al</a><span class="museum-suffix">/museum</span></div>
    <div id="location">forecourt<br>elevation 0</div>
    <div id="coordinates" aria-label="Current museum coordinates">X +000.0 · Y +000.1 · Z +060.0<br>HDG 000° · PITCH +005°</div>
    <div id="help">Move mouse to look · W A S D runs · shift sprints · space jumps · click locks view · escape releases</div>
    <div id="touch-stick" aria-label="Movement control"><div id="touch-knob"></div></div>
    <div id="actions">
      <div id="wing-shortcut">
        <button class="action" id="shortcut-toggle" aria-expanded="false" aria-controls="shortcut-menu">elevator (E)</button>
        <div id="shortcut-menu" hidden>
          <button class="action" data-wing="ART BEFORE 2000">art before 2000</button>
          <button class="action" data-wing="ART AFTER 2000">art after 2000</button>
          <button class="action" data-wing="PHOTOGRAPHY">photography</button>
        </div>
      </div>
      <button class="action" id="reset">return to entrance (R)</button>
      <button class="action" id="xr" hidden>enter immersive</button>
    </div>
  </div>
  <div id="status">preparing the galleries</div>

  <script>
    window.museumStartupComplete = false;
    const showMuseumStartupError = () => {
      if (window.museumStartupComplete) return;
      const status = document.getElementById("status");
      if (!status) return;
      status.textContent = "the museum could not start — reload this page";
      status.classList.add("visible");
    };
    window.addEventListener("error", showMuseumStartupError);
    window.addEventListener("unhandledrejection", showMuseumStartupError);
  </script>
  <script type="module">
    import * as THREE from "three";
    import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";
    import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

    const BLUE = 0x0000ff;
    const WHITE = 0xffffff;
    RectAreaLightUniformsLib.init();
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    scene.fog = new THREE.FogExp2(0xffffff, 0.0022);

    const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.05, 1100);
    camera.position.set(0, 1.68, 0);
    const rig = new THREE.Group();
    const entranceSpawn = new THREE.Vector3(0,.1,88);
    rig.position.copy(entranceSpawn);
    rig.add(camera);
    scene.add(rig);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = false;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.LinearToneMapping;
    renderer.toneMappingExposure = .92;
    renderer.xr.enabled = true;
    renderer.xr.setFramebufferScaleFactor(1);
    renderer.domElement.tabIndex = 0;
    renderer.domElement.setAttribute("aria-label","Interactive museum viewport");
    document.body.prepend(renderer.domElement);

    const blueMaterial = new THREE.MeshLambertMaterial({ color:BLUE, side:THREE.DoubleSide });
    const glassMaterial = new THREE.MeshLambertMaterial({
      color:0xdff5ff, transparent:true, opacity:.34,
      depthWrite:false, side:THREE.DoubleSide
    });
    const whiteLineMaterial = new THREE.LineBasicMaterial({ color: WHITE, linewidth: 1 });
    const blackMaterial = new THREE.MeshLambertMaterial({ color:0x050514, side:THREE.DoubleSide });
    const exteriorGroundMaterial = new THREE.MeshBasicMaterial({
      color:0xffffff,
      side:THREE.DoubleSide
    });
    const frameMaterial = new THREE.MeshLambertMaterial({ color:BLUE, side:THREE.DoubleSide });
    const artFallbackMaterial = new THREE.MeshLambertMaterial({ color:0x1111a0, side:THREE.DoubleSide });
    const navOnlyMaterial = new THREE.MeshBasicMaterial({
      transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide
    });
    const navSurfaces = [];
    const animatedSteps = [];
    const archiveStairColliders = [];
    const fragments = [];
    const entryFragments = [];
    const cloudGroups = [];
    const architecturalMeshes = [];
    const collisionBoxes = [];
    const collisionSegments = [];
    const artworkDoorways = [];
    const columnObstructions = [];
    const interiorSalonWalls = [];
    function registerCollisionBox(w,h,d,x,y,z,padding=.52) {
      collisionBoxes.push({
        minX:x-w/2-padding, maxX:x+w/2+padding,
        minY:y-h/2, maxY:y+h/2,
        minZ:z-d/2-padding, maxZ:z+d/2+padding
      });
    }
    function registerCollisionSegment(a,b,minY,maxY,padding=.72) {
      collisionSegments.push({a,b,minY,maxY,padding});
    }

    function edged(geometry, material = blueMaterial, position = [0,0,0], rotation = [0,0,0], parent = scene, edge = true) {
      const group = new THREE.Group();
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = false;
      mesh.receiveShadow = true;
      group.add(mesh);
      if (edge) {
        const lines = new THREE.LineSegments(new THREE.EdgesGeometry(geometry, 18), whiteLineMaterial);
        lines.renderOrder = 3;
        group.add(lines);
      }
      group.position.set(...position);
      group.rotation.set(...rotation);
      parent.add(group);
      architecturalMeshes.push(group);
      return group;
    }

    function box(w, h, d, x, y, z, parent = scene, material = blueMaterial, nav = false, edge = true) {
      const object = edged(
        new THREE.BoxGeometry(w,h,d),material,[x,y,z],[0,0,0],parent,edge
      );
      if (nav) navSurfaces.push(object.children[0]);
      if (!nav && parent === scene && h >= 2 && y - h/2 <= .65) {
        registerCollisionBox(w,h,d,x,y,z);
      }
      return object;
    }

    const plaqueMaterialCache=new Map();
    function plaque(text, width = 8, height = 1.2) {
      const aspect=Math.max(1,width/height);
      const cacheKey=`${text}:${aspect.toFixed(3)}`;
      if (!plaqueMaterialCache.has(cacheKey)) {
        const canvas = document.createElement("canvas");
        canvas.height=128;
        canvas.width=Math.max(256,Math.round(canvas.height*aspect));
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#0000ff"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
        ctx.strokeRect(2,2,canvas.width-4,canvas.height-4);
        ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        let fontSize=48;
        ctx.font=`${fontSize}px "Times New Roman", Times, serif`;
        while (fontSize>24 && ctx.measureText(text).width>canvas.width-56) {
          fontSize-=2;
          ctx.font=`${fontSize}px "Times New Roman", Times, serif`;
        }
        ctx.fillText(text,canvas.width/2,canvas.height/2+2);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy=1;
        texture.minFilter=THREE.LinearMipmapLinearFilter;
        texture.magFilter=THREE.LinearFilter;
        plaqueMaterialCache.set(cacheKey,new THREE.MeshBasicMaterial({
          map:texture,transparent:true,toneMapped:false
        }));
      }
      return new THREE.Mesh(
        new THREE.PlaneGeometry(width,height),
        plaqueMaterialCache.get(cacheKey)
      );
    }

    function frustumGeometry(bottom,top,height,sides=4,offset=Math.PI/4) {
      const positions=[];
      for (let y of [0,height]) {
        const radius=y===0?bottom:top;
        for (let i=0;i<sides;i++) {
          const angle=offset+i/sides*Math.PI*2;
          positions.push(Math.cos(angle)*radius,y,Math.sin(angle)*radius);
        }
      }
      const indices=[];
      for (let i=1;i<sides-1;i++) {
        indices.push(0,i+1,i,sides,sides+i,sides+i+1);
      }
      for (let i=0;i<sides;i++) {
        const next=(i+1)%sides;
        indices.push(i,next,sides+next,i,sides+next,sides+i);
      }
      const geometry=new THREE.BufferGeometry();
      geometry.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function column(x,z,height=14,parent=scene) {
      const group=new THREE.Group();
      group.position.set(x,0,z);
      if (parent===scene) columnObstructions.push({x,z,half:2.15});

      // A straight-line Corinthian order: stepped plinth, octagonal shaft,
      // flutes, two angular acanthus tiers, corner volutes, and layered abacus.
      edged(new THREE.BoxGeometry(3.25,.28,3.25),blueMaterial,[0,.14,0],[0,0,0],group);
      edged(new THREE.BoxGeometry(2.8,.26,2.8),blueMaterial,[0,.41,0],[0,Math.PI/4,0],group);
      edged(frustumGeometry(1.48,1.16,.72,8),blueMaterial,[0,.54,0],[0,0,0],group);
      edged(new THREE.BoxGeometry(2.25,.18,2.25),blueMaterial,[0,1.24,0],[0,Math.PI/4,0],group);
      edged(frustumGeometry(1.08,.9,height-3.86,8),blueMaterial,[0,1.33,0],[0,0,0],group);
      edged(frustumGeometry(.94,1.14,.38,8),blueMaterial,[0,height-2.53,0],[0,0,0],group);
      edged(frustumGeometry(1.12,1.82,1.18,8),blueMaterial,[0,height-2.15,0],[0,Math.PI/8,0],group);
      edged(new THREE.BoxGeometry(3.55,.22,3.55),blueMaterial,[0,height-.97,0],[0,Math.PI/4,0],group);
      edged(new THREE.BoxGeometry(3.85,.24,3.85),blueMaterial,[0,height-.74,0],[0,0,0],group);
      edged(new THREE.BoxGeometry(3.35,.3,3.35),blueMaterial,[0,height-.47,0],[0,Math.PI/4,0],group);

      const detail=[];
      const line=(a,b) => detail.push(...a,...b);
      const shaftBottom=1.48, shaftTop=height-2.58;
      for (let i=0;i<8;i++) {
        const angle=i*Math.PI/4;
        line(
          [Math.cos(angle)*1.025,shaftBottom,Math.sin(angle)*1.025],
          [Math.cos(angle)*.865,shaftTop,Math.sin(angle)*.865]
        );
      }
      for (let tier=0;tier<2;tier++) {
        for (let i=0;i<8;i++) {
          const angle=(i+tier*.5)*Math.PI/4;
          const side=.12;
          const y0=height-2.05+tier*.42;
          const y1=y0+.62;
          const y2=y0+.25;
          const radial=(r,y,a=angle) => [Math.cos(a)*r,y,Math.sin(a)*r];
          line(radial(1.02,y0),radial(1.48+tier*.13,y1));
          line(radial(1.48+tier*.13,y1),radial(1.2,y2));
          line(radial(1.32,y1-.12,angle-side),radial(1.48+tier*.13,y1));
          line(radial(1.48+tier*.13,y1),radial(1.32,y1-.12,angle+side));
        }
      }
      for (const sx of [-1,1]) for (const sz of [-1,1]) {
        const cx=sx*1.42, cz=sz*1.42, y=height-.86;
        line([cx-sx*.42,y-.34,cz],[cx,y,cz]);
        line([cx,y,cz],[cx-sx*.22,y+.2,cz]);
        line([cx,y,cz-sz*.42],[cx,y,cz]);
        line([cx,y,cz],[cx,y+.2,cz-sz*.22]);
        line([cx-sx*.22,y+.2,cz],[cx,y+.38,cz]);
        line([cx,y+.38,cz],[cx,y+.2,cz-sz*.22]);
      }
      const ornament=new THREE.LineSegments(
        new THREE.BufferGeometry().setAttribute("position",new THREE.Float32BufferAttribute(detail,3)),
        whiteLineMaterial
      );
      ornament.renderOrder=4;
      group.add(ornament);
      parent.add(group);
      return group;
    }

    function beamBetween(x1,y1,x2,y2,z,thickness=.4,depth=.5,parent=scene) {
      const dx=x2-x1,dy=y2-y1;
      const length=Math.hypot(dx,dy);
      return edged(new THREE.BoxGeometry(length,thickness,depth),blueMaterial,
        [(x1+x2)/2,(y1+y2)/2,z],[0,0,Math.atan2(dy,dx)],parent);
    }

    function pointedFrame(x,z,width,height,baseY=0,thickness=.45,depth=.65,parent=scene) {
      const group=new THREE.Group();
      group.position.set(x,baseY,0);
      const shoulder=height*.48;
      edged(new THREE.BoxGeometry(thickness,shoulder,depth),blueMaterial,[-width/2,shoulder/2,z],[0,0,0],group);
      edged(new THREE.BoxGeometry(thickness,shoulder,depth),blueMaterial,[width/2,shoulder/2,z],[0,0,0],group);
      beamBetween(-width/2,shoulder,0,height,z,thickness,depth,group);
      beamBetween(0,height,width/2,shoulder,z,thickness,depth,group);
      parent.add(group);
      return group;
    }

    function cathedralTower(x,z,height,radius,lean=0,parent=scene) {
      const group=new THREE.Group();
      group.position.set(x,0,z);
      group.rotation.z=lean;
      edged(frustumGeometry(radius,radius*.78,height*.48,6),blueMaterial,[0,0,0],[0,0,0],group);
      edged(frustumGeometry(radius*.78,radius*.48,height*.3,6),blueMaterial,[0,height*.48,0],[0,0,0],group);
      edged(frustumGeometry(radius*.48,radius*.22,height*.17,6),blueMaterial,[0,height*.78,0],[0,0,0],group);
      edged(frustumGeometry(radius*.22,0,height*.12,4),blueMaterial,[0,height*.95,0],[0,0,0],group);
      for (let level=0;level<5;level++) {
        const y=height*(.2+level*.12);
        const recess=edged(new THREE.BoxGeometry(radius*.34,height*.055,.16),blackMaterial,
          [0,y,radius*(.72-level*.045)],[0,0,0],group);
        recess.children[0].castShadow=false;
      }
      edged(new THREE.BoxGeometry(radius*.38,radius*.38,radius*.38),blueMaterial,
        [0,height*1.09,0],[0,Math.PI/4,Math.PI/4],group);
      parent.add(group);
      return group;
    }

    function branchingButtress(x,z,height,mirror=1) {
      const group=new THREE.Group();
      group.position.set(x,0,z);
      edged(new THREE.BoxGeometry(3.2,height,3.2),blueMaterial,[0,height/2,0],[0,0,mirror*.1],group);
      edged(new THREE.BoxGeometry(1.5,height*.58,1.7),blueMaterial,[mirror*3,height*.68,0],[0,0,mirror*.58],group);
      edged(new THREE.BoxGeometry(1.25,height*.48,1.5),blueMaterial,[-mirror*2.6,height*.73,0],[0,0,-mirror*.5],group);
      edged(frustumGeometry(1.5,0,3.5,4),blueMaterial,[0,height,0],[0,0,0],group);
      scene.add(group);
      return group;
    }

    function wallWithDoor(w, h, z, doorX = 0, doorW = 6, parent = scene, centerX = 0) {
      const t = .38;
      const leftW = (w - doorW) / 2 + doorX;
      const rightW = (w - doorW) / 2 - doorX;
      box(leftW, h, t, centerX-w/2 + leftW/2, h/2, z, parent);
      box(rightW, h, t, centerX+w/2 - rightW/2, h/2, z, parent);
      box(doorW, 2, t, centerX+doorX, h-1, z, parent);
      if (parent===scene) artworkDoorways.push({
        axis:"x", fixed:z, center:centerX+doorX, half:doorW/2
      });
    }
    function wallWithTwoDoors(w,h,z,doors,centerX=0) {
      const t=.38;
      const left=centerX-w/2;
      const right=centerX+w/2;
      let cursor=left;
      for (const door of [...doors].sort((a,b)=>a.center-b.center)) {
        const doorLeft=door.center-door.width/2;
        const segmentWidth=doorLeft-cursor;
        if (segmentWidth>.05) {
          box(segmentWidth,h,t,cursor+segmentWidth/2,h/2,z);
        }
        box(door.width,1,t,door.center,h-.5,z);
        artworkDoorways.push({
          axis:"x",fixed:z,center:door.center,half:door.width/2
        });
        cursor=door.center+door.width/2;
      }
      const finalWidth=right-cursor;
      if (finalWidth>.05) box(finalWidth,h,t,cursor+finalWidth/2,h/2,z);
    }

    function xWallWithDoor(d, h, x, doorZ = 0, doorW = 6, centerZ = 0) {
      const t = .38;
      const nearD = (d - doorW) / 2 + doorZ;
      const farD = (d - doorW) / 2 - doorZ;
      box(t, h, nearD, x, h/2, centerZ-d/2 + nearD/2);
      box(t, h, farD, x, h/2, centerZ+d/2 - farD/2);
      box(t, 2, doorW, x, h-1, centerZ+doorZ);
      artworkDoorways.push({
        axis:"z", fixed:x, center:centerZ+doorZ, half:doorW/2
      });
    }
    function twoStoryHorizontalWall(width,z,doors,centerX=0,height=18) {
      const thickness=.38;
      const left=centerX-width/2;
      const right=centerX+width/2;
      let cursor=left;
      for (const door of [...doors].sort((a,b)=>a.center-b.center)) {
        const doorLeft=door.center-door.width/2;
        const segmentWidth=doorLeft-cursor;
        if (segmentWidth>.05) {

      const object=edged(
        geometry,material,[0,0,0],[0,0,0],scene,edge
      );
      if (nav) navSurfaces.push(object.children[0]);
      return object;
    }
    function segmentPoint(a,b,t) {
      return {
        x:THREE.MathUtils.lerp(a.x,b.x,t),
        y:THREE.MathUtils.lerp(a.y,b.y,t),
        z:THREE.MathUtils.lerp(a.z,b.z,t)
      };
    }
    function collectionAt(point,side,level=0) {
      // Allocation is weighted by certified wall slots, not by equal angles.
      // Over eleven revolutions this yields 1,164 photography slots, 2,328
      // post-2000 slots, and 4,032 pre-2000/unclassified slots: 15.47%,
      // 30.94%, and 53.59%, closely matching the measured archive.
      const compactPhoto=level===3 || level===7 || level===10;
      const wideAfter=level===0 || level===2 || level===4 ||
        level===6 || level===8;
      if (side===3 || (!compactPhoto && side===2)) return "photo";
      if ((side>=5 && side<=7) || (wideAfter && side===4)) return "after";
      return "art";
    }
    function queueWallJoint(point,height=wallHeight) {
      wallJointPoints.push({
        x:point.x,
        y:point.y+height/2,
        z:point.z,
        height
      });
    }
    function addGeneratedWall(a,b,height,normal,collection,level,record=true) {
      quadSurface([
        a,b,
        {x:b.x,y:b.y+height,z:b.z},
        {x:a.x,y:a.y+height,z:a.z}
      ]);
      registerCollisionSegment(
        {x:a.x,z:a.z},{x:b.x,z:b.z},
        Math.min(a.y,b.y),Math.max(a.y,b.y)+height,.7
      );
      if (record) {
        proceduralArtWalls.push({
          a:{...a},b:{...b},height,
          normal:{...normal},collection,level,
          id:`generated-wall-${proceduralArtWalls.length+1}`
        });
      }
    }
    function addGeneratedRail(a,b) {
      quadSurface([
        a,b,
        {x:b.x,y:b.y+1.15,z:b.z},
        {x:a.x,y:a.y+1.15,z:a.z}
      ]);
      registerCollisionSegment(
        {x:a.x,z:a.z},{x:b.x,z:b.z},
        Math.min(a.y,b.y),Math.max(a.y,b.y)+1.15,.45
      );
    }
    function addTaperedEntryRail(a,b) {
      const midpoint=segmentPoint(a,b,.5);
      quadSurface([
        a,midpoint,
        midpoint,
        {x:a.x,y:a.y+1.15,z:a.z}
      ]);
      quadSurface([
        midpoint,b,
        {x:b.x,y:b.y+1.15,z:b.z},
        midpoint
      ]);
      const leftCollisionEnd=segmentPoint(a,b,.32);
      const rightCollisionStart=segmentPoint(a,b,.68);
      registerCollisionSegment(
        {x:a.x,z:a.z},
        {x:leftCollisionEnd.x,z:leftCollisionEnd.z},
        Math.min(a.y,leftCollisionEnd.y),
        Math.max(a.y,leftCollisionEnd.y)+1.15,.45
      );
      registerCollisionSegment(
        {x:rightCollisionStart.x,z:rightCollisionStart.z},
        {x:b.x,z:b.z},
        Math.min(rightCollisionStart.y,b.y),
        Math.max(rightCollisionStart.y,b.y)+1.15,.45
      );
    }
    function roomPoint(origin,tangent,outward,along,depth,y) {
      return {
        x:origin.x+tangent.x*along+outward.x*depth,
        y,
        z:origin.z+tangent.z*along+outward.z*depth
      };
    }
    function polygonsOverlap(a,b) {
      const polygons=[a,b];
      for (const polygon of polygons) {
        for (let index=0;index<polygon.length;index++) {
          const current=polygon[index];
          const next=polygon[(index+1)%polygon.length];
          const axis={x:-(next.z-current.z),z:next.x-current.x};
          const project=points => points.reduce((range,point) => {
            const value=point.x*axis.x+point.z*axis.z;
            range.min=Math.min(range.min,value);
            range.max=Math.max(range.max,value);
            return range;
          },{min:Infinity,max:-Infinity});
          const projectionA=project(a);
          const projectionB=project(b);
          if (projectionA.max<=projectionB.min+.05 ||
              projectionB.max<=projectionA.min+.05) return false;
        }
      }
      return true;
    }
    function addGeneratedRoom(frontCenter,tangent,outward,y,collection,level) {
      const width=roomWidth;
      const depth=roomDepth;
      const leftFront=roomPoint(frontCenter,tangent,outward,-width/2,.05,y);
      const rightFront=roomPoint(frontCenter,tangent,outward,width/2,.05,y);
      const leftBack=roomPoint(frontCenter,tangent,outward,-width/2,depth,y);
      const rightBack=roomPoint(frontCenter,tangent,outward,width/2,depth,y);
      const footprint=[leftFront,rightFront,rightBack,leftBack];
      const clashes=generatedRoomFootprints.some(room =>
        room.level===level && polygonsOverlap(room.points,footprint)
      );
      if (clashes) {
        generationDiagnostics.roomsRejected++;
        return false;
      }
      generatedRoomFootprints.push({level,points:footprint});
      generationDiagnostics.roomsAccepted++;
      queueWallJoint(leftFront);
      queueWallJoint(rightFront);
      queueWallJoint(leftBack);
      queueWallJoint(rightBack);
      quadSurface([leftFront,rightFront,rightBack,leftBack],blueMaterial,true);
      addGeneratedWall(
        leftBack,rightBack,wallHeight,
        {x:-outward.x,z:-outward.z},collection,level
      );
      addGeneratedWall(
        leftFront,leftBack,wallHeight,
        {x:tangent.x,z:tangent.z},collection,level
      );
      addGeneratedWall(
        rightBack,rightFront,wallHeight,
        {x:-tangent.x,z:-tangent.z},collection,level
      );
      if (level===spiralRevolutions-1) {
        quadSurface([
          {...leftFront,y:y+storyHeight-.35},
          {...rightFront,y:y+storyHeight-.35},
          {...rightBack,y:y+storyHeight-.35},
          {...leftBack,y:y+storyHeight-.35}
        ],glassMaterial);
      }
      return true;
    }

    // The atrium floor and entry threshold connect directly to the first ramp
    // bay. There is no decorative step or disconnected lobby.
    const atriumCenter={x:spiralCenter.x,y:.04,z:spiralCenter.z};
    for (let side=0;side<spiralSides;side++) {
      const angle0=startAngle+side*Math.PI*2/spiralSides;
      const angle1=startAngle+(side+1)*Math.PI*2/spiralSides;
      quadSurface([
        atriumCenter,
        polygonPoint(innerRadius,angle0,.04),
        polygonPoint(innerRadius,angle1,.04),
        atriumCenter
      ],blueMaterial,true);
    }
    const entryInner={x:-6,y:.02,z:51};
    const entryOuter={x:6,y:.02,z:51};
    const rampFrontLeft=polygonPoint(outerRadius,startAngle,.38);
    const rampFrontRight=polygonPoint(outerRadius,startAngle+Math.PI*2/spiralSides,.38);
    const archiveLandingNames=new Map([
      [3,"PHOTOGRAPHY"],
      [6,"ART AFTER 2000"],
      [9,"ART BEFORE 2000"]
    ]);
    document.body.dataset.archiveSeparation="strict";
    const archiveLandings=[];
    quadSurface([
      entryInner,entryOuter,rampFrontLeft,rampFrontRight
    ],blueMaterial,true);

    for (let index=0;index<totalSpiralSegments;index++) {
      const side=index%spiralSides;
      const level=Math.floor(index/spiralSides);
      const angle0=startAngle+index*Math.PI*2/spiralSides;
      const angle1=startAngle+(index+1)*Math.PI*2/spiralSides;
      const y0=index/spiralSides*storyHeight;
      const y1=(index+1)/spiralSides*storyHeight;
      const inner0=polygonPoint(innerRadius,angle0,y0);
      const inner1=polygonPoint(innerRadius,angle1,y1);
      const outer0=polygonPoint(outerRadius,angle0,y0);
      const outer1=polygonPoint(outerRadius,angle1,y1);
      queueWallJoint(outer0);
      quadSurface([inner0,outer0,outer1,inner1],blueMaterial,true);
      const isArchiveLanding=level===0 && archiveLandingNames.has(side);
      if (isArchiveLanding) {
        const railLeft=segmentPoint(inner0,inner1,.2);
        const railRight=segmentPoint(inner0,inner1,.8);
        addGeneratedRail(inner0,railLeft);
        addGeneratedRail(railRight,inner1);
        archiveLandings.push({
          point:segmentPoint(inner0,inner1,.5),
          name:archiveLandingNames.get(side),
          side
        });
      } else if (index===0) {
        addTaperedEntryRail(inner0,inner1);
      } else {
        addGeneratedRail(inner0,inner1);
      }

      const midpoint=segmentPoint(outer0,outer1,.5);
      const outwardLength=Math.hypot(
        midpoint.x-spiralCenter.x,midpoint.z-spiralCenter.z
      );
      const outward={
        x:(midpoint.x-spiralCenter.x)/outwardLength,
        z:(midpoint.z-spiralCenter.z)/outwardLength
      };
      const tangentLength=Math.hypot(outer1.x-outer0.x,outer1.z-outer0.z);
      const tangent={
        x:(outer1.x-outer0.x)/tangentLength,
        z:(outer1.z-outer0.z)/tangentLength
      };
      const inward={x:-outward.x,z:-outward.z};
      const collection=collectionAt(midpoint,side,level);
      const hasRoom=side%2===1;
      const isEntrance=index===0;
      const roomAccepted=hasRoom && addGeneratedRoom(
        midpoint,tangent,outward,(y0+y1)/2,collection,level
      );
      if (roomAccepted || isEntrance) {
        const doorwayWidth=isEntrance?10:roomDoorwayWidth;
        const doorwayFraction=doorwayWidth/tangentLength;
        const leftEnd=.5-doorwayFraction/2;
        const rightStart=.5+doorwayFraction/2;
        const doorwayLeft=segmentPoint(outer0,outer1,leftEnd);
        const doorwayRight=segmentPoint(outer0,outer1,rightStart);
        if (leftEnd>.08) {
          addGeneratedWall(
            outer0,doorwayLeft,
            wallHeight,inward,collection,level
          );
        }
        if (rightStart<.92) {
          addGeneratedWall(
            doorwayRight,outer1,
            wallHeight,inward,collection,level
          );
        }
        const lintelBottom=isEntrance?7:5.8;
        addGeneratedWall(
          {...doorwayLeft,y:doorwayLeft.y+lintelBottom},
          {...doorwayRight,y:doorwayRight.y+lintelBottom},
          wallHeight-lintelBottom,inward,collection,level,false
        );
      } else {
        addGeneratedWall(
          outer0,outer1,wallHeight,inward,collection,level
        );
      }
    }

    // A single instanced seam system seals the vertical joints between every
    // spiral bay and room corner. It costs one draw call and prevents distant
    // daylight slivers from reading as missing upper-floor walls.
    if (wallJointPoints.length) {
      const wallJointMesh=new THREE.InstancedMesh(
        new THREE.BoxGeometry(.46,1,.46),
        blueMaterial,
        wallJointPoints.length
      );
      wallJointPoints.forEach((joint,index) => {
        const matrix=new THREE.Matrix4().compose(
          new THREE.Vector3(joint.x,joint.y,joint.z),
          new THREE.Quaternion(),
          new THREE.Vector3(1,joint.height,1)
        );
        wallJointMesh.setMatrixAt(index,matrix);
      });
      wallJointMesh.instanceMatrix.needsUpdate=true;
      wallJointMesh.frustumCulled=false;
      scene.add(wallJointMesh);
    }

    // The name belongs to the museum itself: mount it on the outward face of
    // the first faceted spiral bay, directly above the main opening.
    const museumFrontMark=plaque("strauh.al/museum",16,1.55);
    museumFrontMark.position.set(
      0,
      7.55,
      (rampFrontLeft.z+rampFrontRight.z)/2+.42
    );
    scene.add(museumFrontMark);

    function buildArchiveStair(landing,index) {
      const radial={
        x:landing.point.x-spiralCenter.x,
        z:landing.point.z-spiralCenter.z
      };
      const radialLength=Math.hypot(radial.x,radial.z);
      radial.x/=radialLength;
      radial.z/=radialLength;
      const perpendicular={x:-radial.z,z:radial.x};
      const bendDirection=index%2===0?1:-1;
      const start={
        x:spiralCenter.x+radial.x*7.2,
        y:.08,
        z:spiralCenter.z+radial.z*7.2
      };
      const end={
        // Continue beyond the guardrail opening and overlap the spiral floor.
        // This removes the former unsupported gap and the collision lip at the
        // top of each stair.
        x:landing.point.x+radial.x*.9,
        y:landing.point.y+.05,
        z:landing.point.z+radial.z*.9
      };
      const width=4.4;
      const stairPoint=(radius,sideOffset,heightProgress) => ({
        x:spiralCenter.x+radial.x*radius+
          perpendicular.x*sideOffset*bendDirection,
        y:THREE.MathUtils.lerp(start.y,end.y,heightProgress),
        z:spiralCenter.z+radial.z*radius+
          perpendicular.z*sideOffset*bendDirection
      });
      const path=[
        start,
        stairPoint(14.2,4.4,.3),
        stairPoint(21.5,-3.8,.67),
        end
      ];
      for (let segmentIndex=0;segmentIndex<path.length-1;segmentIndex++) {
        const a=path[segmentIndex];
        const b=path[segmentIndex+1];
        const dx=b.x-a.x;
        const dz=b.z-a.z;
        const run=Math.hypot(dx,dz);
        const sideNormal={x:-dz/run,z:dx/run};
        const leftStart={
          x:a.x+sideNormal.x*width/2,y:a.y,z:a.z+sideNormal.z*width/2
        };
        const rightStart={
          x:a.x-sideNormal.x*width/2,y:a.y,z:a.z-sideNormal.z*width/2
        };
        const leftEnd={
          x:b.x+sideNormal.x*width/2,y:b.y,z:b.z+sideNormal.z*width/2
        };
        const rightEnd={
          x:b.x-sideNormal.x*width/2,y:b.y,z:b.z-sideNormal.z*width/2
        };
        // This analytic corridor is the authoritative stair floor. It spans
        // the full flight and overlaps the bend capsules, so locomotion never
        // depends on hitting a triangle edge at the current frame rate.
        archiveStairColliders.push({
          a:{x:a.x,y:a.y,z:a.z},
          b:{x:b.x,y:b.y,z:b.z},
          width:width+.7,
          stair:index
        });
        quadSurface(
          [leftStart,rightStart,rightEnd,leftEnd],
          navOnlyMaterial,true,false
        );
        const steps=Math.max(7,Math.ceil(run/.76));
        const angle=Math.atan2(dx,dz);
        for (let stepIndex=0;stepIndex<steps;stepIndex++) {
          const progress=(stepIndex+.5)/steps;
          const step=box(
            width,.14,run/steps*1.1,
            THREE.MathUtils.lerp(a.x,b.x,progress),
            THREE.MathUtils.lerp(a.y,b.y,progress)-.045,
            THREE.MathUtils.lerp(a.z,b.z,progress),
            scene,blueMaterial,false
          );
          step.rotation.y=angle;
          step.userData={
            baseX:step.position.x,
            baseY:step.position.y,
            baseZ:step.position.z,
            phase:index*2.7+segmentIndex*1.3+stepIndex*.22,
            direction:bendDirection
          };
          animatedSteps.push(step);
        }
        if (segmentIndex<path.length-2) {
          box(
            width,.12,width,b.x,b.y-.045,b.z,
            scene,navOnlyMaterial,true,false
          );
        }
      }
      const sign=plaque(landing.name,landing.name.length>16?12:9,1.08);
      sign.position.set(
        start.x-radial.x*.7,
        2.35+index*.08,
        start.z-radial.z*.7
      );
      sign.rotation.y=Math.atan2(-radial.x,-radial.z);
      scene.add(sign);
    }
    archiveLandings
      .sort((a,b)=>a.side-b.side)
      .forEach(buildArchiveStair);
    document.body.dataset.archiveStaircases=String(archiveLandings.length);
    document.body.dataset.penroseCount=String(archiveLandings.length);
    document.body.dataset.archiveStairColliders=String(archiveStairColliders.length);

    // Twelve full-height Corinthian columns define the atrium without
    // occupying any artwork wall or walkway.
    const roofY=spiralRevolutions*storyHeight+4.4;
    for (let side=0;side<spiralSides;side++) {
      const angle=startAngle+side*Math.PI*2/spiralSides;
      const position=polygonPoint(innerRadius-5,angle,0);
      column(position.x,position.z,roofY-.5);
      registerCollisionBox(3.9,roofY-.5,3.9,
        position.x,(roofY-.5)/2,position.z,.25);
    }

    // Legacy groups remain empty; the three labeled, animated archive stairs
    // above are now the museum's functional Penrose circulation.
    const penrose=new THREE.Group();
    scene.add(penrose);
    const rearPenrose=new THREE.Group();
    scene.add(rearPenrose);

    // The former glass plate is removed completely. A radial white-edged
    // structural ring remains around the open crown, allowing the hollow
    // crossing spire to work as an uninterrupted daylight shaft.
    const roofOpeningRadius=22.5;
    for (let side=0;side<spiralSides;side++) {
      const angle0=startAngle+side*Math.PI*2/spiralSides;
      const angle1=startAngle+(side+1)*Math.PI*2/spiralSides;
      const inner0=polygonPoint(roofOpeningRadius,angle0,roofY);
      const inner1=polygonPoint(roofOpeningRadius,angle1,roofY);
      const edge0=polygonPoint(61,angle0,roofY);
      const edge1=polygonPoint(61,angle1,roofY);
      const roofBeam=new THREE.LineSegments(
        new THREE.BufferGeometry().setAttribute(
          "position",
          new THREE.Float32BufferAttribute([
            inner0.x,inner0.y+.05,inner0.z,
            edge0.x,edge0.y+.05,edge0.z,
            inner0.x,inner0.y+.05,inner0.z,
            inner1.x,inner1.y+.05,inner1.z
          ],3)
        ),
        whiteLineMaterial
      );
      roofBeam.renderOrder=4;
      scene.add(roofBeam);
    }

    // Notre-Dame's timber-and-lead silhouette is translated into the archive's
    // straight-edged language: a twelve-sided stepped crown, an open polygonal
    // lantern, and a long slotted needle picked out by the same one-pixel white
    // edges as the museum.
    const centralSpireParts=[];
    function normalizedSpireGeometry(geometry) {
      const normalized=geometry.index
        ? geometry.toNonIndexed()
        : geometry;
      for (const attribute of Object.keys(normalized.attributes)) {
        if (attribute!=="position" && attribute!=="normal") {
          normalized.deleteAttribute(attribute);
        }
      }
      return normalized;
    }
    function addSpireGeometry(geometry,position,rotation,scale) {
      geometry.applyMatrix4(
        new THREE.Matrix4().compose(
          new THREE.Vector3(...position),
          new THREE.Quaternion().setFromEuler(
            new THREE.Euler(...rotation)
          ),
          new THREE.Vector3(...scale)
        )
      );
      centralSpireParts.push(normalizedSpireGeometry(geometry));
    }
    function addSpireBox(
      w,h,d,x,y,z,rx=0,ry=0,rz=0
    ) {
      addSpireGeometry(
        new THREE.BoxGeometry(w,h,d),
        [x,y,z],[rx,ry,rz],[1,1,1]
      );
    }
    function addSpireBeam(a,b,thickness=.42,depth=thickness) {
      const start=new THREE.Vector3(...a);
      const end=new THREE.Vector3(...b);
      const direction=end.clone().sub(start);
      const midpoint=start.clone().add(end).multiplyScalar(.5);
      const geometry=new THREE.BoxGeometry(
        thickness,direction.length(),depth
      );
      const quaternion=new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0,1,0),
        direction.clone().normalize()
      );
      geometry.applyMatrix4(
        new THREE.Matrix4().compose(
          midpoint,quaternion,new THREE.Vector3(1,1,1)
        )
      );
      centralSpireParts.push(normalizedSpireGeometry(geometry));
    }
    function addSpireRing(radius,y,thickness=.48,depth=.48) {
      for (let side=0;side<spiralSides;side++) {
        const angle0=startAngle+side*Math.PI*2/spiralSides;
        const angle1=startAngle+(side+1)*Math.PI*2/spiralSides;
        addSpireBeam(
          [
            spiralCenter.x+Math.cos(angle0)*radius,y,
            spiralCenter.z+Math.sin(angle0)*radius
          ],
          [
            spiralCenter.x+Math.cos(angle1)*radius,y,
            spiralCenter.z+Math.sin(angle1)*radius
          ],
          thickness,depth
        );
      }
    }
    function addSpirePoly(
      topRadius,bottomRadius,height,y,sides=8,rotation=0
    ) {
      addSpireGeometry(
        new THREE.CylinderGeometry(
          topRadius,bottomRadius,height,sides,1,true
        ),
        [spiralCenter.x,y,spiralCenter.z],
        [0,rotation,0],[1,1,1]
      );
    }
    function addSpireFacetedShell(
      topRadius,bottomRadius,bottomY,topY,
      sides=8,rotation=0,gapRatio=.1
    ) {
      const step=Math.PI*2/sides;
      const inset=step*gapRatio*.5;
      for (let side=0;side<sides;side++) {
        const angle0=rotation+side*step+inset;
        const angle1=rotation+(side+1)*step-inset;
        const bottom0=[
          spiralCenter.x+Math.cos(angle0)*bottomRadius,bottomY,
          spiralCenter.z+Math.sin(angle0)*bottomRadius
        ];
        const bottom1=[
          spiralCenter.x+Math.cos(angle1)*bottomRadius,bottomY,
          spiralCenter.z+Math.sin(angle1)*bottomRadius
        ];
        const top0=[
          spiralCenter.x+Math.cos(angle0)*topRadius,topY,
          spiralCenter.z+Math.sin(angle0)*topRadius
        ];
        const top1=[
          spiralCenter.x+Math.cos(angle1)*topRadius,topY,
          spiralCenter.z+Math.sin(angle1)*topRadius
        ];
        const geometry=new THREE.BufferGeometry();
        geometry.setAttribute(
          "position",
          new THREE.Float32BufferAttribute([
            ...bottom0,...top1,...bottom1,
            ...bottom0,...top0,...top1
          ],3)
        );
        geometry.computeVertexNormals();
        centralSpireParts.push(normalizedSpireGeometry(geometry));
      }
    }
    // The low plinth keeps the original outer silhouette, but it is assembled
    // from rings and separated ribs. The negative space between them opens
    // directly onto the roof oculus.
    // The transition is inset inside the museum crown and uses shallow,
    // blade-thin facets. It still grows directly out of the roof, but leaves
    // a clean perimeter reveal instead of spilling over the crown's edge.
    addSpireFacetedShell(
      13.9,16.35,roofY-.16,roofY+1.06,
      12,startAngle,.028
    );
    addSpireFacetedShell(
      11.6,13.9,roofY+1.06,roofY+2.62,
      12,startAngle,.034
    );
    addSpireFacetedShell(
      9.6,11.6,roofY+2.62,roofY+4.42,
      12,startAngle,.04
    );
    addSpireRing(16.35,roofY-.14,.28,.3);
    addSpireRing(13.9,roofY+1.06,.25,.28);
    addSpireRing(11.6,roofY+2.62,.23,.25);
    addSpireRing(9.6,roofY+4.42,.21,.23);
    for (let side=0;side<spiralSides;side++) {
      const angle=startAngle+side*Math.PI*2/spiralSides;
      const outer=[
        spiralCenter.x+Math.cos(angle)*9.6,
        roofY+4.42,
        spiralCenter.z+Math.sin(angle)*9.6
      ];
      const inner=[
        spiralCenter.x+Math.cos(angle)*6.65,
        roofY+11.8,
        spiralCenter.z+Math.sin(angle)*6.65
      ];
      addSpireBeam(outer,inner,.44,.5);
    }
    // Open belfry: paired piers and pointed lancet heads retain sacred

    async function mountUniqueCollection(entries,mounts,usedURLs,matchCentury=false) {
      let cursor=0;
      const buckets=new Map();
      const bucketCursors=new Map();
      const wallMountCounts=new Map();
      if (matchCentury) {
        for (const item of entries) {
          const century=inferCentury(item);
          if (!buckets.has(century)) buckets.set(century,[]);
          buckets.get(century).push(item);
        }
        for (const descriptor of mounts) {
          if (descriptor.occupied) continue;
          wallMountCounts.set(
            descriptor.wallId,(wallMountCounts.get(descriptor.wallId)||0)+1
          );
        }
      }
      const nextUnused=(items,key) => {
        let index=key==="all" ? cursor : bucketCursors.get(key)||0;
        while (index<items.length && usedURLs.has(items[index][1])) index++;
        if (key==="all") cursor=index+1;
        else bucketCursors.set(key,index+1);
        return items[index];
      };
      for (const descriptor of mounts) {
        if (descriptor.occupied) continue;
        let item;
        if (matchCentury) {
          const targetCentury=Number(descriptor.century.slice(0,4));
          if (!mountedCenturyByWall.has(descriptor.wallId)) {
            const needed=wallMountCounts.get(descriptor.wallId)||1;
            const choices=[...buckets.keys()].map(century => {
              const items=buckets.get(century);
              const start=bucketCursors.get(century)||0;
              let available=0;
              for (let index=start;index<items.length;index++) {
                if (!usedURLs.has(items[index][1])) available++;
              }
              return {
                century,available,
                distance:Math.abs(Number(century.slice(0,4))-targetCentury)
              };
            }).filter(choice=>choice.available>0);
            const sufficient=choices
              .filter(choice=>choice.available>=needed)
              .sort((a,b)=>a.distance-b.distance);
            const fallback=choices.sort((a,b)=>
              b.available-a.available || a.distance-b.distance
            );
            const exact=choices.find(choice=>
              choice.century===descriptor.century &&
              choice.available>=needed
            );
            const selectedCentury=(
              exact||sufficient[0]||fallback[0]
            )?.century;
            if (selectedCentury) {
              mountedCenturyByWall.set(descriptor.wallId,selectedCentury);
            }
          }
          const chosenCentury=mountedCenturyByWall.get(descriptor.wallId);
          if (chosenCentury) {
            item=nextUnused(buckets.get(chosenCentury),chosenCentury);
          }
          if (!item) continue;
        } else {
          item=nextUnused(entries,"all");
        }
        if (!item) break;
        usedURLs.add(item[1]);
        descriptor.occupied=true;
        descriptor.mountedCentury=inferCentury(item);
        artwork(
          item,descriptor.x,descriptor.y,descriptor.z,descriptor.rotationY,
          descriptor.maxW,descriptor.maxH,descriptor.collection
        );
        catalogMountedCount++;
        if (/\.gif(?:$|\?)/i.test(item[1])) {
          catalogGifMountedCount++;
          if (!document.body.dataset.firstGifMount) {
            document.body.dataset.firstGifMount=`${descriptor.x},${descriptor.y},${descriptor.z},${descriptor.rotationY}`;
          }
        }
        document.body.dataset.mountedWorks=String(catalogMountedCount);
        document.body.dataset.mountedGifs=String(catalogGifMountedCount);
        if (catalogMountedCount%72===0) await new Promise(requestAnimationFrame);
      }

        renderer.domElement.setPointerCapture?.(e.pointerId);
        document.body.classList.add("looking");
      }
    });
    renderer.domElement.addEventListener("pointermove", e => {
      if (pointerLocked) return;
      lastMovementAt=performance.now();
      if (e.pointerType==="touch") {
        if (e.pointerId !== lookPointer) return;
        yaw -= (e.clientX-lookLastX)*.005;
        pitch = THREE.MathUtils.clamp(pitch-(e.clientY-lookLastY)*.005,-1.2,1.2);
      } else if (hoverLookReady) {
        yaw -= (e.clientX-lookLastX)*.00235;
        pitch = THREE.MathUtils.clamp(pitch-(e.clientY-lookLastY)*.0021,-1.2,1.2);
        updateEdgeLook(e);
      }
      lookLastX=e.clientX; lookLastY=e.clientY;
    });
    function endLook(e) {
      if (e.pointerId===lookPointer) {

      }

    renderer.domElement.addEventListener("pointerup",endLook);
    renderer.domElement.addEventListener("pointercancel",endLook);
    renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());

    function blockedAt(x,z) {
      const feet=rig.position.y+.05;
      const head=rig.position.y+1.78;
      if (collisionBoxes.some(box =>
        x>box.minX && x<box.maxX && z>box.minZ && z<box.maxZ &&
        head>box.minY && feet<box.maxY
      )) return true;
      return collisionSegments.some(segment => {
        if (head<=segment.minY || feet>=segment.maxY) return false;
        const dx=segment.b.x-segment.a.x;
        const dz=segment.b.z-segment.a.z;
        const lengthSquared=dx*dx+dz*dz||1;
        const t=THREE.MathUtils.clamp(
          ((x-segment.a.x)*dx+(z-segment.a.z)*dz)/lengthSquared,0,1
        );
        const nearestX=segment.a.x+dx*t;
        const nearestZ=segment.a.z+dz*t;
        return Math.hypot(x-nearestX,z-nearestZ)<segment.padding;
      });
    }

    function archiveStairFloorAt(x,z,currentY) {
      let best=null;
      for (const corridor of archiveStairColliders) {
        const dx=corridor.b.x-corridor.a.x;
        const dz=corridor.b.z-corridor.a.z;
        const lengthSquared=dx*dx+dz*dz||1;
        const t=THREE.MathUtils.clamp(
          ((x-corridor.a.x)*dx+(z-corridor.a.z)*dz)/lengthSquared,
          0,1
        );
        const nearestX=corridor.a.x+dx*t;
        const nearestZ=corridor.a.z+dz*t;
        const lateralDistance=Math.hypot(x-nearestX,z-nearestZ);
        if (lateralDistance>corridor.width/2) continue;
        const y=THREE.MathUtils.lerp(corridor.a.y,corridor.b.y,t)+.025;
        const verticalDistance=Math.abs(y-currentY);
        if (y>currentY+.95 || y<currentY-2.35) continue;
        const score=lateralDistance+verticalDistance*.18;
        if (!best || score<best.score) best={y,score,corridor};
      }
      return best;
    }

    function updateWalk(dt) {
      if (renderer.xr.isPresenting) return;
      if (!pointerLocked) {
        yaw-=edgeLookX*dt*1.35;
        pitch=THREE.MathUtils.clamp(pitch-edgeLookY*dt*1.05,-1.2,1.2);
      }
      camera.rotation.set(pitch,yaw,0,"YXZ");
      const forward = Number(keys.has("KeyW")||keys.has("ArrowUp")) - Number(keys.has("KeyS")||keys.has("ArrowDown")) - touchMove.y;
      const side = Number(keys.has("KeyD")||keys.has("ArrowRight")) - Number(keys.has("KeyA")||keys.has("ArrowLeft")) + touchMove.x;
      const sprinting=keys.has("ShiftLeft")||keys.has("ShiftRight");
      const targetFov=sprinting?84:baseFov;
      const nextFov=THREE.MathUtils.damp(camera.fov,targetFov,sprinting?8:11,dt);
      if (Math.abs(nextFov-camera.fov)>.01) {
        camera.fov=nextFov;
        camera.updateProjectionMatrix();
      }
      const speed = (sprinting ? 12.5 : 7.5) * dt;
      const forwardVector = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
      forwardVector.y = 0;
      forwardVector.normalize();
      const rightVector = new THREE.Vector3().crossVectors(forwardVector,new THREE.Vector3(0,1,0)).normalize();
      const move = new THREE.Vector3()
        .addScaledVector(forwardVector,forward)
        .addScaledVector(rightVector,side);
      if (move.lengthSq()) {
        lastMovementAt=performance.now();
        move.normalize().multiplyScalar(speed);
        const nextX = THREE.MathUtils.clamp(rig.position.x+move.x,bounds.minX,bounds.maxX);
        const nextZ = THREE.MathUtils.clamp(rig.position.z+move.z,bounds.minZ,bounds.maxZ);
        // Resolve axes separately so the visitor slides along walls instead of
        // tunnelling through them or stopping dead at a shallow angle.
        if (!blockedAt(nextX,rig.position.z)) rig.position.x=nextX;
        if (!blockedAt(rig.position.x,nextZ)) rig.position.z=nextZ;
      }
      if (!grounded) {
        verticalVelocity -= 15.5*dt;
        rig.position.y += verticalVelocity*dt;
      }
      // Grounded movement follows continuous stair ramps beneath the decorative
      // treads; airborne movement lands only while descending.
      groundRaycaster.set(new THREE.Vector3(rig.position.x,rig.position.y+.8,rig.position.z),down);
      groundRaycaster.far = 2.15;
      const floorHits = groundRaycaster.intersectObjects(navSurfaces,false);
      const stairFloor=archiveStairFloorAt(
        rig.position.x,rig.position.z,rig.position.y
      );
      let floorY=floorHits.length?floorHits[0].point.y+.02:null;
      if (stairFloor && (
        floorY===null ||
        Math.abs(stairFloor.y-rig.position.y)<
          Math.abs(floorY-rig.position.y)+.08
      )) {
        floorY=stairFloor.y;
      }
      if (floorY!==null) {
        const delta = floorY-rig.position.y;
        if (grounded && delta <= .62 && delta >= -1.3) {
          // Lock exactly to the analytic stair rather than damping behind its
          // incline; the latter could put the ray origin below the next flight
          // during a sprint or a low-frame-rate frame.
          rig.position.y = stairFloor
            ? floorY
            : THREE.MathUtils.damp(rig.position.y,floorY,20,dt);
        } else if (!grounded && verticalVelocity <= 0 && delta >= -.12 && delta <= .72) {
          rig.position.y = floorY;
          verticalVelocity = 0;
          grounded = true;
        } else if (grounded && delta < -1.3) {
          if (hasSafeUpperPosition &&
              lastSafeUpperPosition.y>1 &&
              floorY<lastSafeUpperPosition.y-1.8) {
            rig.position.copy(lastSafeUpperPosition);
            verticalVelocity=0;
            grounded=true;
          } else {
            grounded = false;
          }
        }
        const wouldDiscardUpperRecovery=
          hasSafeUpperPosition &&
          lastSafeUpperPosition.y>1 &&
          floorY<lastSafeUpperPosition.y-1.8;
        if (floorY>=0 && grounded && Math.abs(delta)<.72 &&
            !wouldDiscardUpperRecovery) {
          lastSafeUpperPosition.set(rig.position.x,floorY,rig.position.z);
          hasSafeUpperPosition=true;
        }
      } else if (grounded) {
        if (rig.position.y>5 && hasSafeUpperPosition) {
          rig.position.copy(lastSafeUpperPosition);
          verticalVelocity=0;
          grounded=true;
        } else {
          grounded = false;
        }
      }
      // Exterior ground can sit below an upper museum floor and used to catch
      // a falling visitor before the no-hit recovery branch ran. Restore the
      // last certified museum surface as soon as a multi-storey drop begins.
      if (hasSafeUpperPosition &&
          lastSafeUpperPosition.y>1 &&
          rig.position.y<lastSafeUpperPosition.y-2.2) {
        rig.position.copy(lastSafeUpperPosition);
        verticalVelocity=0;
        grounded=true;
      }
      const radialDistance=Math.hypot(
        rig.position.x-spiralCenter.x,rig.position.z-spiralCenter.z
      );
      const angle=((Math.atan2(
        rig.position.z-spiralCenter.z,rig.position.x-spiralCenter.x
      )-startAngle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
      const zoneSide=Math.floor(angle/(Math.PI*2/spiralSides));
      const zeroBasedLevel=THREE.MathUtils.clamp(
        Math.floor(rig.position.y/storyHeight),0,spiralRevolutions-1
      );
      const collection=collectionAt(rig.position,zoneSide,zeroBasedLevel);
      const zone=rig.position.z>50
        ? "forecourt"
        : radialDistance<innerRadius-1
          ? "central atrium"
            : collection==="after"
              ? "art after 2000"
              : collection==="photo"
                ? "photography wing"
                : "art before 2000";
      const level=zeroBasedLevel+1;
      document.getElementById("location").innerHTML =
        `${zone}<br>floor ${level} · elevation ${Math.round(rig.position.y)}`;
      window.museumState = { initialized:true,x:rig.position.x,y:rig.position.y,z:rig.position.z,yaw,pitch,forward,side,pointerLocked,frames:(window.museumState.frames||0)+1 };
      renderer.domElement.dataset.position = `${rig.position.x.toFixed(3)},${rig.position.y.toFixed(3)},${rig.position.z.toFixed(3)}`;
      renderer.domElement.dataset.camera = `${yaw.toFixed(4)},${pitch.toFixed(4)}`;
      renderer.domElement.dataset.frames = String(window.museumState.frames);
      updateCoordinateReadout();
    }

    // WebXR: a single standards-based immersive-vr path for Meta Quest and visionOS Safari.
    const xrButton = document.getElementById("xr");
    async function detectXR() {
      if (!navigator.xr || !window.isSecureContext) return;
      try {
        if (await navigator.xr.isSessionSupported("immersive-vr")) {
          xrButton.hidden = false;
          xrButton.textContent = /Vision|Apple/i.test(navigator.userAgent) ? "enter spatial museum" : "enter immersive";
        }
      } catch (_) {}
    }
    detectXR();
    xrButton.addEventListener("click", async () => {
      try {
        if (renderer.xr.isPresenting) {
          await renderer.xr.getSession().end();
          return;
        }
        const session = await navigator.xr.requestSession("immersive-vr", {
          requiredFeatures: ["local-floor"],
          optionalFeatures: ["bounded-floor", "hand-tracking", "layers"]
        });
        await renderer.xr.setSession(session);
        xrButton.textContent = "leave immersive";
        session.addEventListener("end", () => xrButton.textContent = "enter immersive", { once:true });
      } catch (error) {
        const status = document.getElementById("status");
        status.textContent = "immersive mode needs HTTPS and headset permission";
        status.classList.add("visible");
        setTimeout(()=>status.classList.remove("visible"), 3600);
      }
    });

    function addXRPointer(index) {
      const controller = renderer.xr.getController(index);
      const lineGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
      const line = new THREE.Line(lineGeometry, new THREE.LineBasicMaterial({ color: WHITE }));
      line.scale.z = 18;
      controller.add(line);
      controller.addEventListener("select", () => {
        tempMatrix.identity().extractRotation(controller.matrixWorld);
        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMatrix);
        const hits = raycaster.intersectObjects(navSurfaces, false);
        if (hits.length) {
          const point = hits[0].point;
          rig.position.x = THREE.MathUtils.clamp(point.x,bounds.minX,bounds.maxX);
          rig.position.z = THREE.MathUtils.clamp(point.z,bounds.minZ,bounds.maxZ);
          rig.position.y = Math.max(0, point.y);
        }
      });
      rig.add(controller);
    }
    addXRPointer(0); addXRPointer(1);

    const artworkFrustum = new THREE.Frustum();
    const artworkViewProjection = new THREE.Matrix4();
    const artworkCameraPosition = new THREE.Vector3();
    const artworkCameraDirection = new THREE.Vector3();
    const artworkToCamera = new THREE.Vector3();
    const artworkSphere = new THREE.Sphere();
    let lastArtworkVisibilityUpdate = -Infinity;
    let lastTextureTrim = -Infinity;
    function updateArtworkStreaming(time) {
      if (time-lastArtworkVisibilityUpdate < 285) return;
      lastArtworkVisibilityUpdate = time;
      const movingRecently=time-lastMovementAt<180;
      rig.updateMatrixWorld(true);
      const xrCamera = renderer.xr.isPresenting ? renderer.xr.getCamera(camera) : camera;
      const viewCamera = xrCamera.isArrayCamera ? xrCamera.cameras[0] : xrCamera;
      viewCamera.updateMatrixWorld(true);
      viewCamera.matrixWorldInverse.copy(viewCamera.matrixWorld).invert();
      artworkViewProjection.multiplyMatrices(viewCamera.projectionMatrix,viewCamera.matrixWorldInverse);
      artworkFrustum.setFromProjectionMatrix(artworkViewProjection);
      viewCamera.getWorldPosition(artworkCameraPosition);
      viewCamera.getWorldDirection(artworkCameraDirection);
      const cameraPolarAngle=Math.atan2(
        artworkCameraPosition.z-spiralCenter.z,
        artworkCameraPosition.x-spiralCenter.x
      );

      let visible = 0;
      let pending = 0;
      let proxyMatrixDirty=false;
      for (const surface of artworkProxyHidden) {
        proxyMatrixDirty=setArtworkProxyVisible(surface,true) || proxyMatrixDirty;
      }
      artworkProxyHidden.clear();
      const wantedTextureKeys = new Set();
      visibleAnimatedTextures.clear();
      const drawCandidates=[];
      const preloadCandidates=[];
      for (const surface of artworkSurfaces) {
        artworkToCamera.subVectors(surface.worldPosition,artworkCameraPosition);
        const distance = artworkToCamera.length();
        const alignment = distance ? artworkCameraDirection.dot(artworkToCamera.multiplyScalar(1/distance)) : 1;
        // artworkToCamera points from the visitor toward the artwork.  The
        // generated wall normal points from the wall toward the visitor's
        // viewing side, so a visible front face has the opposite direction.
        // Using the un-negated dot product selected paintings through the
        // backs of walls while rejecting the paintings directly in front of
        // the visitor.
        const facing = -surface.worldNormal.dot(artworkToCamera);
        const surfacePolarAngle=Math.atan2(
          surface.worldPosition.z-spiralCenter.z,
          surface.worldPosition.x-spiralCenter.x
        );
        const angularDifference=Math.abs(Math.atan2(
          Math.sin(surfacePolarAngle-cameraPolarAngle),
          Math.cos(surfacePolarAngle-cameraPolarAngle)
        ));
        const nearbyStory=Math.abs(
          surface.worldPosition.y-artworkCameraPosition.y
        )<8.7;
        const nearbySector=angularDifference<1.2 || distance<18;
        artworkSphere.center.copy(surface.worldPosition);
        artworkSphere.radius = Math.max(surface.maxW,surface.maxH)*.72;

        // Exact-frustum visibility prevents any image draw calls behind the visitor.
        // Front-face and near-field tests reject work hidden on the far side of walls.
        const shouldDraw = nearbyStory && nearbySector &&
          distance < 48 && alignment > .1 && facing > .03 &&
          artworkFrustum.intersectsSphere(artworkSphere);
        const shouldStream = shouldDraw || (
          nearbyStory && nearbySector &&
          distance < 56 && alignment > .4 && facing > -.08
        );
        if (surface.group?.visible) surface.group.visible=false;
        if (surface.titleLabel?.visible) surface.titleLabel.visible=false;
        const verticalCoverage=
          2*Math.atan(surface.maxH/(2*Math.max(distance,.1)))/
          THREE.MathUtils.degToRad(viewCamera.fov||baseFov);
        const candidate={
          surface,distance,alignment,verticalCoverage,
          score:distance-alignment*9
        };
        if (shouldDraw) drawCandidates.push(candidate);
        else if (shouldStream) preloadCandidates.push(candidate);
      }
      drawCandidates.sort((a,b)=>a.score-b.score);
      preloadCandidates.sort((a,b)=>a.score-b.score);
      const drawLimit=renderer.xr.isPresenting?20:(movingRecently?24:36);
      const selected=drawCandidates.slice(0,drawLimit);
      const preload=movingRecently
        ? []
        : preloadCandidates.slice(0,renderer.xr.isPresenting?1:2);
      const fullResolutionLimit=renderer.xr.isPresenting?1:2;
      const fullResolutionSurfaces=new Set(
        selected
          .filter(candidate=>
            candidate.distance<12 &&
            candidate.verticalCoverage>.22 &&
            candidate.alignment>.28
          )
          .sort((a,b)=>b.verticalCoverage-a.verticalCoverage)
          .slice(0,fullResolutionLimit)
          .map(candidate=>candidate.surface)
      );
      for (const {surface,distance,alignment} of selected) {
        materializeArtwork(surface);
        surface.group.visible=true;
        proxyMatrixDirty=setArtworkProxyVisible(surface,false) || proxyMatrixDirty;
        artworkProxyHidden.add(surface);
        if (distance<5.5 && alignment>.18) ensureArtworkLabel(surface);
        surface.lastWantedAt=time;
        const desiredTier=fullResolutionSurfaces.has(surface) &&
          !isAnimatedImageURL(surface.item[1])
          ? "full"
          : "preview";
        if (desiredTier==="full") surface.lastFullWantedAt=time;
        if (surface.textureTier==="full" && desiredTier==="preview" &&
            time-surface.lastFullWantedAt>650) {
          releaseArtworkTexture(surface);
        }
        surface.requestedTier=desiredTier;
        visible++;
        if (textureTierRank[surface.textureTier]<
            textureTierRank[effectiveTextureTier(surface.item[1],desiredTier)]) {
          pending++;
        }
        if (surface.texture?.userData.animated) visibleAnimatedTextures.add(surface.texture);
        const desiredKey=textureCacheKey(surface.item[1],desiredTier);
        wantedTextureKeys.add(desiredKey);
        if (surface.loadingTier) {
          wantedTextureKeys.add(textureCacheKey(surface.item[1],surface.loadingTier));
        }
        if (!surface.loading &&
            textureTierRank[surface.textureTier]<
            textureTierRank[effectiveTextureTier(surface.item[1],desiredTier)]) {
          streamArtwork(
            surface,
            alignment*8-distance*.08+(desiredTier==="full"?30:0),
            desiredTier
          );
        }
      }
      for (const {surface,distance,alignment} of preload) {
        surface.lastWantedAt=time;
        surface.requestedTier="preview";
        wantedTextureKeys.add(textureCacheKey(surface.item[1],"preview"));
        if (surface.loadingTier) {
          wantedTextureKeys.add(textureCacheKey(surface.item[1],surface.loadingTier));
        }
        if (!movingRecently && surface.textureTier==="none" && !surface.loading) {
          streamArtwork(surface,alignment*8-distance*.08,"preview");
        }
      }
      if (proxyMatrixDirty && artworkProxyMesh) {
        artworkProxyMesh.instanceMatrix.needsUpdate=true;
      }
      for (const [key,job] of textureJobsByURL) {
        if (!wantedTextureKeys.has(key)) job.cancel();
      }
      if (time-lastTextureTrim>1000) {
        lastTextureTrim=time;
        const resident=artworkSurfaces.filter(surface=>surface.loaded && surface.texture);
        // Full originals disappear almost immediately after they stop filling
        // the view. Small previews get a modest LRU pool and also expire by age,
        // so a long museum visit cannot grow GPU memory without bound.
        resident
          .filter(surface=>
            surface.textureTier==="full" &&
            !fullResolutionSurfaces.has(surface) &&
            time-surface.lastFullWantedAt>700
          )
          .forEach(releaseArtworkTexture);
        resident
          .filter(surface=>
            surface.textureTier==="preview" &&
            time-surface.lastWantedAt>2400
          )
          .forEach(releaseArtworkTexture);
        const previewResident=artworkSurfaces.filter(surface=>
          surface.loaded && surface.textureTier==="preview"
        );
        const previewResidentLimit=renderer.xr.isPresenting?22:40;
        if (previewResident.length>previewResidentLimit) {
          previewResident
            .filter(surface=>time-surface.lastWantedAt>650)
            .sort((a,b)=>a.lastWantedAt-b.lastWantedAt)
            .slice(0,previewResident.length-previewResidentLimit)
            .forEach(releaseArtworkTexture);
        }
        renderer.domElement.dataset.residentTextures=String(
          artworkSurfaces.reduce((count,surface)=>count+Number(surface.loaded),0)
        );
        renderer.domElement.dataset.previewTextures=String(
          artworkSurfaces.reduce(
            (count,surface)=>count+Number(surface.textureTier==="preview"),0
          )
        );
        renderer.domElement.dataset.fullTextures=String(
          artworkSurfaces.reduce(
            (count,surface)=>count+Number(surface.textureTier==="full"),0
          )
        );
        renderer.domElement.dataset.textureCacheEntries=
          String(texturePromiseCache.size);
        artworkSurfaces
          .filter(surface=>
            surface.group && !surface.loaded && !surface.loading &&
            time-surface.lastWantedAt>3600
          )
          .forEach(dematerializeArtwork);
      }
      showCollectionCount(visible,pending);
      window.artworkStreamingState = {
        visible, pending, total:artworkSurfaces.length,
        queued:textureQueue.filter(job => !job.cancelled).length,
        active:activeTextureJobs
      };
      if (animatedSteps[0]) {
        const step=animatedSteps[0].position;
        renderer.domElement.dataset.penrose=`${step.x.toFixed(3)},${step.y.toFixed(3)},${step.z.toFixed(3)}`;
      }
      renderer.domElement.dataset.colliders=String(collisionBoxes.length);
      renderer.domElement.dataset.animatedGifs=String(visibleAnimatedTextures.size);
    }

    function animate(time) {
      const dt = Math.min(clock.getDelta(), .05);
      animatedSteps.forEach(step => {
        // The visible treads move above stable invisible ramps, preserving the
        // Penrose wave without ever opening a collision gap under the visitor.
        const wave=Math.sin(time*.00115+step.userData.phase);
        step.position.y=step.userData.baseY+wave*.18;
        step.position.x=step.userData.baseX+Math.cos(time*.00082+step.userData.phase)*.035*step.userData.direction;
        step.position.z=step.userData.baseZ+Math.sin(time*.00067+step.userData.phase)*.025;
        step.rotation.z=wave*.014;
      });
      penrose.updateMatrixWorld(true);
      rearPenrose.updateMatrixWorld(true);
      updateWalk(dt);
      updateArtworkStreaming(time);
      fragments.forEach((fragment, i) => {
        fragment.position.y = fragment.userData.baseY + Math.sin(time*.001*fragment.userData.speed + fragment.userData.phase)*1.2;
        fragment.rotation.y += dt*(.05+(i%4)*.018);
        fragment.rotation.x += dt*.025;
      });
      entryFragments.forEach((piece,index) => {
        const phase=time*.00024+piece.userData.phase;
        piece.position.y=piece.userData.baseY+Math.sin(phase)*.18;
        piece.rotation.y=piece.userData.baseRotationY+Math.sin(phase*.73)*.018;
        piece.rotation.z=piece.userData.baseRotationZ+Math.cos(phase*.61)*.012;
      });
      perimeterShardStates.forEach((state,index) => {
        const phase=time*.00018*state.speed+state.phase;
        perimeterShardDummy.position.set(
          state.x+Math.sin(phase*.41)*.32,
          state.y+Math.sin(phase)*.72,
          state.z+Math.cos(phase*.37)*.28
        );
        perimeterShardDummy.rotation.set(
          state.rotation.x+Math.sin(phase*.53)*.09,
          state.rotation.y+Math.sin(phase*.31)*.13,
          state.rotation.z+Math.cos(phase*.47)*.08
        );
        perimeterShardDummy.scale.copy(state.scale);
        perimeterShardDummy.updateMatrix();
        perimeterShardFill.setMatrixAt(index,perimeterShardDummy.matrix);
        perimeterShardWire.setMatrixAt(index,perimeterShardDummy.matrix);
      });
      perimeterShardFill.instanceMatrix.needsUpdate=true;
      perimeterShardWire.instanceMatrix.needsUpdate=true;
      cloudGroups.forEach(cloud => {
        cloud.position.x+=dt*cloud.userData.speed;
        if (cloud.position.x>185) cloud.position.x-=370;
      });
      flyingBirds.forEach((bird,index) => {
        const flightSeconds=time*.001;
        const flight=bird.userData;
        // A compact avian stroke model: a quick, extended power stroke takes
        // 38% of the cycle; the slower recovery stroke folds and sweeps the
        // wings inward. Every bird keeps its own rate and phase.
        const beatVariation=
          .94+Math.sin(flightSeconds*.57+flight.phase*1.9)*.06;
        flight.wingPhase=(
          flight.wingPhase+dt*flight.wingRate*beatVariation
        )%(Math.PI*2);
        const cycle=flight.wingPhase/(Math.PI*2);
        const powerStroke=cycle<.38;
        const strokeProgress=powerStroke
          ? THREE.MathUtils.smoothstep(cycle,0,.38)
          : THREE.MathUtils.smoothstep(cycle,.38,1);
        const rawFlap=powerStroke
          ? 1-2*strokeProgress
          : -1+2*strokeProgress;
        const recoveryFold=powerStroke
          ? 0
          : Math.sin(strokeProgress*Math.PI);
        const downstrokePulse=powerStroke
          ? Math.sin(strokeProgress*Math.PI)
          : 0;
        const flap=rawFlap*flight.strokeAmplitude;
        const coursePhase=flightSeconds*.48+flight.phase;
        const leftAsymmetry=
          Math.sin(coursePhase*.91+flight.phase)*.018;
        const rightAsymmetry=
          Math.sin(coursePhase*.83+flight.phase*1.31)*.018;
        const recoverySweep=recoveryFold*.12;
        flight.leftWing.rotation.x=flap+leftAsymmetry;
        flight.rightWing.rotation.x=-flap+rightAsymmetry;
        flight.leftWing.rotation.y=-recoverySweep;
        flight.rightWing.rotation.y=recoverySweep;
        flight.leftWing.rotation.z=
          -.075+downstrokePulse*.055-recoveryFold*.06;
        flight.rightWing.rotation.z=
          .075-downstrokePulse*.055+recoveryFold*.06;
        const foldedSpan=1-recoveryFold*.19;
        flight.leftWing.scale.z=foldedSpan;
        flight.rightWing.scale.z=foldedSpan;
        // Downstroke-generated lift drives a damped vertical spring. The
        // delayed response gives the body perceptible weight instead of making
        // the entire bird trace the same rigid wing sine wave.
        const downstroke=.24+downstrokePulse*.72;
        const bobAcceleration=
          downstroke*2.65/flight.mass-
          .82-
          flight.bobOffset*7.4-
          flight.bobVelocity*3.15;
        flight.bobVelocity+=bobAcceleration*dt;
        flight.bobOffset+=flight.bobVelocity*dt;
        flight.bobOffset=THREE.MathUtils.clamp(
          flight.bobOffset,-.18,.24
        );
        let routeHeading=0;
        if (flight.route) {
          flight.routeProgress=(
            flight.routeProgress+
            dt*flight.speed/flight.route.length
          )%1;
          const routeT=flight.routeProgress;
          const inverseT=1-routeT;
          const route=flight.route;
          bird.position.x=
            inverseT*inverseT*route.start.x+
            2*inverseT*routeT*route.control.x+
            routeT*routeT*route.end.x;
          bird.position.y=
            inverseT*inverseT*route.start.y+
            2*inverseT*routeT*route.control.y+
            routeT*routeT*route.end.y+
            Math.sin(flightSeconds*1.4+flight.phase)*
              flight.glideBias+
            flight.bobOffset;
          bird.position.z=
            inverseT*inverseT*route.start.z+
            2*inverseT*routeT*route.control.z+
            routeT*routeT*route.end.z+
            Math.sin(coursePhase)*.65;
          const tangentX=
            2*inverseT*(route.control.x-route.start.x)+
            2*routeT*(route.end.x-route.control.x);
          const tangentZ=
            2*inverseT*(route.control.z-route.start.z)+
            2*routeT*(route.end.z-route.control.z);
          routeHeading=Math.atan2(-tangentZ,tangentX);
        } else {
          bird.position.x+=
            dt*flight.speed*
            (.97+Math.sin(coursePhase*.73)*.03);
          bird.position.y=
            flight.baseY+
            Math.sin(flightSeconds*1.4+flight.phase)*
              flight.glideBias+
            flight.bobOffset;
          bird.position.z=
            flight.baseZ+
            Math.sin(coursePhase)*2.65;
        }
        const desiredBank=
          Math.sin(coursePhase*.81)*.042+
          Math.sin(flightSeconds*.31+flight.phase*1.7)*.012;
        const bankAcceleration=
          (desiredBank-flight.bankOffset)*4.2-
          flight.bankVelocity*2.8;
        flight.bankVelocity+=bankAcceleration*dt;
        flight.bankOffset+=flight.bankVelocity*dt;
        const bodyPitch=-flight.bobVelocity*.19;
        bird.rotation.z=
          bodyPitch+
          Math.sin(time*.0009+index)*.026;
        // Shallow course corrections keep the flight readable as a flock
        // without making every bird follow an identical mechanical rail.
        bird.rotation.x=flight.bankOffset;
        bird.rotation.y=
          routeHeading+Math.cos(coursePhase)*.035;
        flight.body.position.y=-Math.abs(rawFlap)*.018;
        flight.body.rotation.z=bodyPitch*.28;
        flight.tail.rotation.z=
          THREE.MathUtils.clamp(-bodyPitch*.72,-.16,.16);
        if (!flight.route && bird.position.x>190) {
          bird.position.x-=380;
        }
      });
      visibleAnimatedTextures.forEach(texture => texture.needsUpdate=true);
      const daylightPhase=Math.sin(time*.00003);
      const sunX=-78+daylightPhase*18;
      sun.position.x=sunX;
      sunGlow.position.x=sunX;
      sun.intensity=3.65+Math.max(0,Math.sin(time*.00018))*.55;
      sunGlow.material.opacity=.76+Math.sin(time*.00018)*.12;
      renderer.render(scene,camera);
    }
    renderer.setAnimationLoop(animate);
    window.museumStartupComplete=true;

    addEventListener("resize", () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
      renderer.setPixelRatio(1);
    });

    // Fail softly when a GPU context is interrupted by a headset browser.
    renderer.domElement.addEventListener("webglcontextlost", e => {
      e.preventDefault();
      const status = document.getElementById("status");
      status.textContent = "restoring the museum";
      status.classList.add("visible");
    });
    renderer.domElement.addEventListener("webglcontextrestored", () => {
      document.getElementById("status").classList.remove("visible");
    });
  </script>
</body>
</html>
